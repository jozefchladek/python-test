{% extends "base.html" %}
{% block title %}Nové heslo{% endblock %}
{% block auth_content %}
<div class="w-full max-w-sm fade-in">
    <div class="text-center mb-8">
        <div class="text-5xl mb-3">⚽🏌️</div>
        <h1 class="text-3xl font-bold text-gray-800">Nové heslo</h1>
        <p class="text-gray-500 mt-1">Zadaj nové heslo pre svoj účet.</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-700 px-4 py-3 rounded-xl mb-4 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/reset-password" class="space-y-4">
        <input type="hidden" name="token" value="{{ token }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nové heslo</label>
            <input type="password" name="new_password" required autofocus minlength="4"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition touch-target">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Zopakuj nové heslo</label>
            <input type="password" name="new_password2" required minlength="4"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition touch-target">
        </div>
        <button type="submit"
            class="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold hover:bg-brand-700 transition touch-target">
            Zmeniť heslo
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
        <a href="/login" class="text-brand-600 font-semibold hover:underline">Späť na prihlásenie</a>
    </p>
</div>
{% endblock %}
