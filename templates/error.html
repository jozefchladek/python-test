{% extends "base.html" %}
{% block auth_content %}
<div class="w-full max-w-sm text-center">
    {% if status_code == 404 %}
    <div class="text-6xl mb-4">🔍</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Stránka nenájdená</h1>
    {% elif status_code == 403 %}
    <div class="text-6xl mb-4">🔒</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Prístup zamietnutý</h1>
    {% elif status_code == 429 %}
    <div class="text-6xl mb-4">⏳</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Príliš veľa pokusov</h1>
    {% else %}
    <div class="text-6xl mb-4">😕</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Chyba</h1>
    {% endif %}
    <p class="text-gray-600 mb-6">{{ detail }}</p>
    <div class="flex gap-3 justify-center">
        <a href="javascript:history.back()" class="inline-block bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-semibold hover:bg-gray-300">
            Späť
        </a>
        <a href="/" class="inline-block bg-brand-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-brand-700">
            Prehľad
        </a>
    </div>
</div>
{% endblock %}
