{% extends "base.html" %}
{% block title %}Upraviť {{ pitch.name }}{% endblock %}
{% block content %}
<div class="fade-in space-y-6">
    <div>
        <a href="/pitches/{{ pitch.id }}" class="text-brand-600 text-sm font-medium">← Späť</a>
        <h1 class="text-2xl font-bold text-gray-800 mt-2">✏️ Upraviť ihrisko</h1>
    </div>

    <form method="post" action="/pitches/{{ pitch.id }}/edit" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Názov ihriska</label>
            <input type="text" name="name" required value="{{ pitch.name }}"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Popis <span class="text-gray-400">(voliteľné)</span></label>
            <textarea name="description" rows="2"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition resize-none">{{ pitch.description or '' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">📍 Lokalita <span class="text-gray-400">(voliteľné)</span></label>
            <input type="text" name="location" id="location-input" value="{{ pitch.location or '' }}"
                autocomplete="off"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
        </div>

        <!-- Par per hole -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">Par pre každú jamku</label>
            <div class="grid grid-cols-3 gap-2">
                {% for hole in pitch.holes %}
                <div class="bg-white rounded-xl border border-gray-200 p-3 text-center">
                    <div class="text-xs text-gray-500 mb-1">Jamka {{ hole.hole_number }}</div>
                    <input type="number" name="par_{{ hole.hole_number }}" min="2" max="6" value="{{ hole.par }}"
                        class="w-full text-center text-lg font-bold border border-gray-200 rounded-lg py-1 focus:border-brand-500 outline-none">
                </div>
                {% endfor %}
            </div>
        </div>

        <button type="submit"
            class="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold hover:bg-brand-700 transition touch-target">
            ✅ Uložiť zmeny
        </button>
    </form>
</div>

{% if google_maps_api_key %}
<script>
function initAutocomplete() {
    const input = document.getElementById('location-input');
    const autocomplete = new google.maps.places.Autocomplete(input, {
        types: ['establishment', 'geocode'],
        fields: ['formatted_address', 'name', 'geometry']
    });
    autocomplete.addListener('place_changed', function() {
        const place = autocomplete.getPlace();
        if (place.name && place.formatted_address) {
            input.value = place.name + ', ' + place.formatted_address;
        }
    });
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=places&callback=initAutocomplete" async defer></script>
{% endif %}
{% endblock %}
