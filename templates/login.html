{% extends "base.html" %}
{% block title %}Prihlásenie{% endblock %}
{% block auth_content %}
<div class="w-full max-w-sm fade-in">
    <div class="text-center mb-8">
        <div class="text-5xl mb-3">⚽🏌️</div>
        <h1 class="text-3xl font-bold text-gray-800">Footgolfisti</h1>
        <p class="text-gray-500 mt-1">Sleduj svoje skóre, zlepšuj sa!</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-700 px-4 py-3 rounded-xl mb-4 text-sm">
        {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div class="bg-green-50 text-green-700 px-4 py-3 rounded-xl mb-4 text-sm">
        {{ success }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Používateľské meno</label>
            <input type="text" name="username" required autofocus
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition touch-target">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Heslo</label>
            <input type="password" name="password" required
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition touch-target">
        </div>
        <button type="submit"
            class="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold hover:bg-brand-700 transition touch-target">
            Prihlásiť sa
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        <a href="/forgot-password" class="text-brand-600 hover:underline">Zabudol si heslo?</a>
    </p>

    <p class="text-center text-sm text-gray-500 mt-2">
        Nemáš účet?
        <a href="/register" class="text-brand-600 font-semibold hover:underline">Zaregistruj sa</a>
    </p>
</div>
{% endblock %}
