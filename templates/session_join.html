{% extends "base.html" %}
{% block title %}Pripojiť sa{% endblock %}
{% block content %}
<div class="fade-in space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-800">🤝 Pripojiť sa k hre</h1>
        <p class="text-gray-500 text-sm mt-1">Zadaj kód pozvania od kamaráta</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-700 px-4 py-3 rounded-xl text-sm">
        ❌ {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/sessions/join" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kód pozvania</label>
            <input type="text" name="invite_code" required maxlength="6" placeholder="ABC123"
                class="w-full px-4 py-4 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition text-center text-2xl font-bold tracking-widest uppercase invite-code"
                style="letter-spacing: 0.3em;">
        </div>

        <button type="submit"
            class="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold hover:bg-brand-700 transition touch-target">
            Pripojiť sa
        </button>
    </form>
</div>
{% endblock %}
